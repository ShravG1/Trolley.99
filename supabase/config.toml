# Minimal Supabase project config. `supabase start` reads this for local dev.
project_id = "trolley"

[db]
port = 54322
major_version = 17

[auth]
# Magic-link only; no passwords (§2.1, §5.3).
enable_signup = true
# Long-lived sessions so nobody is bounced to login mid-shop (§5.3).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# Attaching/changing a backup email must be confirmed via the emailed link before
# it's applied (§5.3) — matches the live project (mailer_autoconfirm=false) so the
# backup email is actually proven. The AccountBackup UI already waits on the link.
enable_confirmations = true
secure_email_change = true
# Short single-use magic links; rate-limited send guards email bombing (§5.6).
max_frequency = "60s"

[functions.send-push]
verify_jwt = true

[functions.recurring]
# Scheduled via cron; invoked by the platform scheduler, not end users. Gated by
# a shared CRON_SECRET header instead of a JWT (the public anon JWT must not be
# able to trigger it).
verify_jwt = false

[functions.feedback-digest]
# Same: scheduled-only, gated by the CRON_SECRET header rather than a JWT.
verify_jwt = false
